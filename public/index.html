<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#161413">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="通过私人网络使用主机上的 Grok">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
    <link rel="stylesheet" href="/styles.css">
    <title>Grok Remote</title>
  </head>
  <body>
    <section id="login-view" class="login-view">
      <form id="token-form" class="login-card">
        <div class="login-brand">
          <img class="login-icon" src="/logo.svg" alt="">
          <h1>Grok Remote</h1>
        </div>
        <label for="token-input">访问令牌<span class="login-label-hint">（登录状态存于浏览器）</span></label>
        <input id="token-input" type="password" autocomplete="current-password">
        <button id="connect-button" class="primary" type="submit">连接</button>
        <p id="login-status" class="form-status" aria-live="polite"></p>
      </form>
    </section>

    <div id="app-view" class="app-view" data-sidebar-collapsed="false" data-mobile-sidebar-open="false" hidden>
      <aside id="session-sidebar" class="session-sidebar" aria-label="会话导航">
        <div class="sidebar-heading">
          <span class="sidebar-brand">
            <img class="sidebar-brand-icon" src="/logo.svg" alt="">
            <strong>Grok Remote</strong>
          </span>
          <button id="collapse-sidebar-button" class="quiet small icon-button" type="button" aria-label="收起会话列表" title="收起会话列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>

        <div class="project-controls">
          <div class="project-row">
            <label>
              <span class="visually-hidden">项目</span>
              <select id="project-select" aria-label="项目"></select>
              <svg class="directory-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6" transform="rotate(-90 12 12)"/></svg>
            </label>
            <button id="new-session-button" class="quiet small icon-button create-icon-button" type="button" aria-label="新会话" title="新会话">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17.5A3.5 3.5 0 0 1 3 14V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v3"/><path d="m5 17.5-1 3.5 4-2h3m7-5v6m-3-3h6"/></svg>
            </button>
          </div>
        </div>

        <label class="session-search">
          <span class="visually-hidden">搜索会话</span>
          <input id="session-search-input" type="search" maxlength="256" placeholder="搜索会话">
        </label>

        <div class="session-list-heading">
          <button id="session-view-back-button" class="quiet small icon-button" type="button" aria-label="返回最近会话" title="返回最近会话" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <strong id="session-view-title">最近会话</strong>
          <button id="archived-sessions-button" class="quiet small icon-button" type="button" aria-label="已归档" title="已归档">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
          </button>
          <button id="trash-sessions-button" class="quiet small icon-button" type="button" aria-label="回收站" title="回收站">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
          <button id="select-sessions-button" class="quiet small icon-button" type="button" aria-label="选择" title="选择">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
          </button>
        </div>

        <div id="selection-heading" class="selection-heading" hidden></div>

        <div id="session-list" class="session-list" role="list" aria-live="polite"></div>
        <button id="load-more-sessions-button" class="quiet load-more-sessions" type="button" hidden>加载更多</button>

      </aside>

      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭会话列表" tabindex="-1"></button>

      <section class="conversation-shell">
        <header class="app-header">
          <div class="conversation-heading">
            <button id="open-sidebar-button" class="quiet sidebar-open-button" type="button" aria-label="打开会话列表">☰</button>
            <div>
              <strong id="current-session-title">Grok Remote</strong>
              <span id="connection-status" class="connection-status" data-state="connecting">正在连接</span>
            </div>
          </div>
        </header>

        <main id="timeline" class="timeline" aria-live="polite">
          <div id="history-loader" class="history-loader" hidden>
            <button id="load-older-button" class="quiet small" type="button">加载更早</button>
          </div>
          <div id="empty-state" class="empty-state">
            <p>选择以前的会话，或者新建一个会话。</p>
          </div>
          <div id="thinking-indicator" class="thinking-indicator" role="status" hidden>
            <span id="thinking-label">正在思考</span>
            <span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
        </main>

        <aside id="approval-list" class="approval-list" aria-live="assertive"></aside>

        <div id="notice" class="notice" role="status" hidden>
          <span id="notice-text"></span>
          <span class="notice-actions">
            <button id="notice-action-button" class="quiet small" type="button" hidden></button>
            <button id="notice-close-button" class="quiet small" type="button" aria-label="关闭提示">关闭</button>
          </span>
        </div>

        <form id="composer" class="composer">
          <div id="slash-menu" class="slash-menu" role="listbox" hidden></div>
          <input id="attachment-input" class="visually-hidden" type="file" multiple tabindex="-1">
          <div id="attachment-list" class="attachment-list" aria-live="polite" hidden></div>
          <div class="composer-shell">
            <textarea
              id="message-input"
              rows="1"
              maxlength="524288"
              placeholder="先选择或新建会话"
              aria-label="消息"
              disabled
            ></textarea>
            <div class="composer-actions">
              <div class="composer-action-scroll" aria-label="快捷操作">
                <button
                  id="attachment-button"
                  class="quiet composer-shortcut"
                  type="button"
                  aria-label="选择附件"
                  title="选择一个或多个附件"
                  disabled
                >附件</button>
                <button
                  id="command-menu-button"
                  class="quiet composer-shortcut command-menu-button"
                  type="button"
                  aria-label="打开 Grok 命令"
                  title="打开 Grok 命令"
                  disabled
                >/</button>
                <button id="rewind-shortcut" class="quiet composer-shortcut" type="button" disabled>rewind</button>
                <button
                  id="always-approve-shortcut"
                  class="quiet composer-shortcut always-approve-shortcut"
                  type="button"
                  aria-pressed="false"
                  disabled
                >always-approve</button>
              </div>
              <span class="composer-hint">电脑可按 Ctrl / ⌘ + Enter 发送</span>
              <button id="task-button" class="primary task-button" type="submit" data-action="send" aria-label="发送" title="发送" disabled>
                <svg class="task-send-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M8 3 4 7M8 3l4 4"/></svg>
                <span class="task-stop-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </form>
      </section>
    </div>

    <dialog id="app-alert-dialog" class="app-alert-dialog" aria-labelledby="app-alert-title" aria-describedby="app-alert-message">
      <form method="dialog">
        <h2 id="app-alert-title">提示</h2>
        <p id="app-alert-message"></p>
        <div class="app-alert-actions">
          <button class="primary" type="submit" autofocus>知道了</button>
        </div>
      </form>
    </dialog>
    <dialog
      id="confirm-dialog"
      class="alert-dialog"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
    >
      <form id="confirm-dialog-form" method="dialog" class="alert-card">
        <h2 id="confirm-dialog-title">确认</h2>
        <div id="confirm-dialog-message" class="confirm-dialog-copy"></div>
        <div class="alert-actions">
          <button id="confirm-dialog-cancel-button" class="quiet" type="button">取消</button>
          <button id="confirm-dialog-accept-button" class="primary" type="submit" value="confirm">
            确定
          </button>
        </div>
      </form>
    </dialog>
    <dialog
      id="rename-session-dialog"
      class="app-alert-dialog"
      aria-labelledby="rename-session-title"
    >
      <form id="rename-session-form" method="dialog" class="rename-card">
        <h2 id="rename-session-title">重命名会话</h2>
        <label class="rename-field">
          <span class="visually-hidden">会话名称</span>
          <input
            id="rename-session-input"
            type="text"
            maxlength="160"
            autocomplete="off"
            placeholder="输入新的会话名称"
          >
        </label>
        <p id="rename-session-status" class="form-status" aria-live="polite"></p>
        <div class="app-alert-actions">
          <button id="rename-session-cancel-button" class="quiet" type="button">取消</button>
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <script src="/boot.js"></script>
    <script type="module" src="/slash-menu.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
